name: CI (SFML 3.x Multi-Platform Matrix)

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - {
              name: Windows,
              os: windows-latest,
              flags: "-A x64 -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows",
            }
          - {
              name: Linux GCC,
              os: ubuntu-latest,
              flags: "-DCMAKE_TOOLCHAIN_FILE=/usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake",
            }
          - {
              name: Linux Clang,
              os: ubuntu-latest,
              flags: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_TOOLCHAIN_FILE=/usr/local/share/vcpkg/scripts/buildsystems/vcpkg.cmake",
            }
          - { name: macOS, os: macos-latest }
        config:
          - { name: Shared, flags: "-DBUILD_SHARED_LIBS=TRUE" }
          - { name: Static, flags: "-DBUILD_SHARED_LIBS=FALSE" }

    steps:
      # Step 1: Checkout the project source code
      - name: Checkout
        uses: actions/checkout@v4

      # Step 2: Install dependencies for each platform (Targeting SFML 3.x)

      # 2.1. For Linux: Install system graphics and X11 dependencies required by SFML
      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxext-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev libharfbuzz-dev libopenal-dev

      # 2.2. For macOS: Use Homebrew (which natively serves SFML 3.x)
      - name: Install macOS Dependencies (SFML 3.x)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install sfml

      # 2.3. For Windows & Linux: Create Vcpkg Manifest mode file (Fetches latest SFML 3.x)
      - name: Create Vcpkg Manifest (SFML 3.x)
        if: runner.os != 'macOS'
        run: |
          echo '{
            "name": "super-mario-ci",
            "version-string": "1.0.0",
            "dependencies": [
              "sfml"
            ]
          }' > vcpkg.json

      # Step 3: Run CMake configuration
      - name: Configure
        run: cmake -B build ${{ matrix.platform.flags }} ${{ matrix.config.flags }}

      # Step 4: Compile and build the project
      - name: Build
        run: cmake --build build --config Release
