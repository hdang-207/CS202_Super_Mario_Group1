name: C++ CMake CI with Multi-Platform Matrix

# Trigger workflow on all branches (including nested branches like feature/...)
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }} (${{ matrix.config.name }})
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: Windows VS2022, os: windows-2022 }
        - { name: Linux GCC,      os: ubuntu-latest }
        - { name: Linux Clang,    os: ubuntu-latest, flags: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" }
        - { name: macOS,          os: macos-latest,  flags: "-DCMAKE_PREFIX_PATH=/opt/homebrew" }
        config:
        - { name: Shared, flags: "-DBUILD_SHARED_LIBS=TRUE" }
        - { name: Static, flags: "-DBUILD_SHARED_LIBS=FALSE" }

    steps:
    # -----------------------------------------------------------------
    # STEP 1: INSTALL DEPENDENCIES FOR EACH PLATFORM
    # -----------------------------------------------------------------
    
    # 1.1. For Linux: Install system graphics/audio dependencies and the SFML library
    - name: Install Linux Dependencies & SFML
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxrandr-dev libxcursor-dev libxi-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype6-dev libopenal-dev
        sudo apt-get install -y libsfml-dev

    # 1.2. For macOS: Install SFML using Homebrew
    - name: Install macOS Dependencies (SFML)
      if: runner.os == 'macOS'
      run: |
        brew install sfml

    # 1.3. For Windows VS2022: Use Vcpkg to manage the SFML package
    - name: Install Windows Dependencies via Vcpkg
      if: runner.os == 'Windows'
      run: |
        vcpkg install sfml:x64-windows

    # -----------------------------------------------------------------
    # STEP 2: CHECKOUT CODE AND COMPILE (CORE ACTIONS)
    # -----------------------------------------------------------------
    
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2.1. Configure CMake for UNIX environments (Linux & macOS)
    - name: Configure CMake (Linux & macOS)
      if: runner.os != 'Windows'
      run: cmake -B build ${{ matrix.platform.flags }} ${{ matrix.config.flags }}

    # 2.2. Configure CMake for Windows (Force x64 architecture and integrate Vcpkg Toolchain)
    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: >
        cmake -B build -A x64
        ${{ matrix.platform.flags }}
        ${{ matrix.config.flags }}
        -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
        -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build Project
      run: cmake --build build --config Release
