name: CI (SFML 3.x Multi-Platform Matrix)

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: Windows, os: windows-latest, flags: "-A x64" }
          - { name: Linux GCC, os: ubuntu-latest, flags: "" }
          - { name: Linux Clang, os: ubuntu-latest, flags: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++" }
          - { name: macOS, os: macos-latest }
        config:
          - { name: Shared, flags: "-DBUILD_SHARED_LIBS=TRUE" }
          - { name: Static, flags: "-DBUILD_SHARED_LIBS=FALSE" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (X11 & OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libxext-dev libudev-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev libharfbuzz-dev libopenal-dev libx11-xcb-dev libxcb1-dev libxcb-randr0-dev libxcb-image0-dev libgl-dev

      - name: Install macOS Dependencies (SFML 3.x)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install sfml

      - name: Setup Vcpkg
        if: runner.os != 'macOS'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '9d7f79f56ae1a9b4704d6a7fb8237e347a974133'

      - name: Configure
        run: |
          if [ "${{ runner.os }}" != "macOS" ]; then
            cmake -B build ${{ matrix.platform.flags }} ${{ matrix.config.flags }} -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          else
            cmake -B build ${{ matrix.platform.flags }} ${{ matrix.config.flags }}
          fi

      - name: Build
        run: cmake --build build --config Release
